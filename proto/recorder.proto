syntax = "proto3";

package automation.v1;

import "proto/locator.proto";

option go_package = "github.com/ranjith035/morego/proto/v1;v1";

service RecorderService {
  rpc StartRecording (StartRecordingRequest) returns (StartRecordingResponse);
  rpc StopRecording (StopRecordingRequest) returns (StopRecordingResponse);
  rpc StreamEvents (StreamEventsRequest) returns (stream RecordedEvent);
}

message StartRecordingRequest {
  string session_id = 1;
}

message StartRecordingResponse {
  bool success = 1;
  string error_message = 2;
}

message StopRecordingRequest {
  string session_id = 1;
}

message StopRecordingResponse {
  bool success = 1;
  string generated_code_path = 2;
}

message StreamEventsRequest {
  string session_id = 1;
}

enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_TAP = 1;
  EVENT_TYPE_TEXT_INPUT = 2;
  EVENT_TYPE_SWIPE = 3;
  EVENT_TYPE_BACK_BUTTON = 4;
  EVENT_TYPE_APP_BACKGROUND = 5;
  EVENT_TYPE_APP_FOREGROUND = 6;
}

message RecordedEvent {
  EventType type = 1;
  int64 timestamp_ms = 2;
  oneof payload {
    TapPayload tap = 3;
    TextInputPayload text_input = 4;
    SwipePayload swipe = 5;
  }
}

message TapPayload {
  int32 x = 1;
  int32 y = 2;
  Locator target_locator = 3; // Best matching locator generated by locator ranking
}

message TextInputPayload {
  string element_id = 1;
  string text = 2;
  Locator target_locator = 3;
}

message SwipePayload {
  int32 start_x = 1;
  int32 start_y = 2;
  int32 end_x = 3;
  int32 end_y = 4;
  int32 duration_ms = 5;
}
