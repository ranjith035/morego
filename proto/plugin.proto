syntax = "proto3";

package automation.v1;

option go_package = "github.com/ranjith035/morego/proto/v1;v1";

service PluginService {
  rpc RegisterPlugin (RegisterPluginRequest) returns (RegisterPluginResponse);
  rpc StreamHooks (StreamHooksRequest) returns (stream HookInvocation);
  rpc SubmitHookResult (HookResult) returns (HookResultResponse);
}

message RegisterPluginRequest {
  string plugin_name = 1;
  string version = 2;
  repeated string subscribed_events = 3; // e.g. ["before_click", "after_click"]
}

message RegisterPluginResponse {
  string registration_id = 1;
  bool accepted = 2;
  string reason = 3;
}

message StreamHooksRequest {
  string registration_id = 1;
}

message HookInvocation {
  string hook_id = 1;
  string event_name = 2; // e.g. "before_click"
  string session_id = 3;
  map<string, string> payload = 4;
}

message HookResult {
  string hook_id = 1;
  bool continue_execution = 2; // Can abort the action if false
  string error_message = 3;
  map<string, string> modified_payload = 4; // Plugins can mutate inputs
}

message HookResultResponse {
  bool success = 1;
}
