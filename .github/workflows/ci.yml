name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Verify Go Formatting
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not formatted correctly:"
            gofmt -s -l .
            exit 1
          fi

      - name: Go Work Sync
        run: go work sync

      - name: Go Vet
        run: go vet ./cmd/... ./core/... ./drivers/... ./pkg/...

      - name: Run Tests
        run: go test -v -race ./cmd/... ./core/... ./drivers/... ./pkg/...

      - name: Build Binary
        run: go build -o bin/mobile ./cmd/main.go
